# Railway deploy config.
#
# Tells Railway to use our Dockerfile (which is pinned to linux/amd64 and
# binds to $PORT) and where to find the healthcheck. All other config —
# SECRET_KEY, DATABASE_URL, APP_URL, API keys — goes in the Railway
# dashboard env vars or is provisioned by the Postgres plugin.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand here on purpose — Railway runs the Dockerfile's CMD which
# is shell-form (`sh -c "gunicorn … -b 0.0.0.0:${PORT:-8000} main:app"`) so
# ${PORT} actually expands. Setting startCommand here would override the
# Dockerfile and Railway's startCommand expansion isn't reliable.
healthcheckPath = "/health"
# 300s window — init_db runs migrations + seeds + an at-rest token re-encrypt
# pass on every cold boot, and with multiple workers serialized through a
# pg_advisory_lock the total startup time is roughly 2× the single-worker
# init time. Anything under ~2 min isn't enough headroom on a cold Postgres.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
